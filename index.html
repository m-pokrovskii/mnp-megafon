<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой тариф</title>

<style>
  :root {
    --bg-page: #EDEDEA;
    --surface-card: #FFFFFF;
    --surface-inner: #F5F4F0;
    --border: #E3E1DA;
    --text-primary: #1F1E1C;
    --text-secondary: #6B6A65;
    --accent-bg: #E6F1FB;
    --accent-text: #000;
    --abn-text: #0C447C;
    --success-bg: #00b956;
    --success-text: #fff;
    --btn-bg: #00b956;
    --btn-text: #FFFFFF;
  }

  * { box-sizing: borde-box; }
  
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-page);
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri Light, 'Trebuchet MS', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone {
    width: 100%;
    max-width: 380px;
    background: var(--surface-card);
    border-radius: 28px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    margin: 24px 12px;
  }

  .topbar {
    padding: 18px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .topbar svg { width: 22px; height: 22px; color: var(--text-primary); }

  .topbar .title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .header {
    padding: 16px 20px 4px;
    text-align: center;
  }

  .header .label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .header .plan-name {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--text-primary);
  }

  .price-block {
    margin: 20px;
    background: var(--accent-bg);
    border-radius: 20px;
    padding: 26px 20px;
    text-align: center;
  }

  .price-block .label {
    font-size: 13px;
    color: var(--abn-text);
    margin-bottom: 4px;
    font-weight: 500;
  }

  .price-block .price {
    font-size: 60px;
    font-weight: 700;
    color: var(--abn-text);
    line-height: 1.1;
    letter-spacing: -3px;
  }

  .price-block .period {
    font-size: 13px;
    color: var(--abn-text);
    margin-top: 4px;
  }

  .features {
    margin: 0 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .feature-card {
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .feature-icon {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .feature-icon.calls { background: var(--success-bg);}
  .feature-icon.calls svg { color: var(--success-text); }

  .feature-icon.data { background: var(--success-bg); }
  .feature-icon.data svg { color: var(--success-text); }

  .feature-icon svg { width: 22px; height: 22px; }

  .feature-text .value {
    font-size: 27px;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1.2;
    letter-spacing: -0.3px;
  }

  .feature-text .desc {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .cta {
    padding: 4px 20px 24px;
    text-align: center;
  }

  .cta .btn {
    display: inline-flex;
    text-decoration: none;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 50px;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
    padding-bottom: 2px;
  }

  .cta .btn:hover { opacity: 0.9; }
  .cta .btn:active { opacity: 0.75; }
</style>
</head>
<body>

<div class="phone">

  <div class="header">
    <div class="label">Тариф</div>
    <div class="plan-name">ВАШ</div>
  </div>

  <div class="price-block">
    <div class="label">Абонентская плата</div>
    <div class="price">500 ₽</div>
    <div class="period">в месяц</div>
  </div>

  <div class="features">
    <div class="feature-card">
      <div class="feature-icon calls">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2" /></svg>
      </div>
      <div class="feature-text">
        <div class="value">2000 минут</div>
        <div class="desc">Звонки по России</div>
      </div>
    </div>

    <div class="feature-card">
      <div class="feature-icon data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 18l.01 0" /><path d="M9.172 15.172a4 4 0 0 1 5.656 0" /><path d="M6.343 12.343a8 8 0 0 1 11.314 0" /><path d="M3.515 9.515c4.686 -4.687 12.284 -4.687 17 0" /></svg>
      </div>
      <div class="feature-text">
        <div class="value">Безлимит</div>
        <div class="desc">Интернет без ограничений</div>
      </div>
    </div>
  </div>

  <div class="cta">
    <a
      class="btn"
      href="https://murmansk.megafon.ru/perenos_tarifa/drugoy_operator/"
      target="_blank"
      >
      Скопируй этот тариф
  </a>
  </div>
</div>

</body>
</html>
